<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus — Maqueta</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/app5.css">
</head>
<body>

<!-- Barra de la demo: no forma parte del producto -->
<div id="demo-bar">
  <strong>Maqueta · Versión 5</strong>
  <label>Ver como
    <select id="rol-select" onchange="cambiarRol(this.value)">
      <option value="familia">Familia</option>
      <option value="alumno">Alumno</option>
      <option value="docente">Docente</option>
      <option value="secretaria">Secretaría</option>
    </select>
  </label>
  <label>Nivel
    <select id="nivel-select" onchange="cambiarNivel(this.value)">
      <option value="jardin">Jardín</option>
      <option value="primario">Primario</option>
      <option value="secundario">Secundario</option>
    </select>
  </label>
  <button onclick="reiniciar()">Reiniciar</button>
</div>

<div class="marco">
  <nav id="lateral"></nav>
  <div class="app">
    <header id="cabecera"></header>
    <main id="pantalla"></main>
  </div>
</div>
<nav id="pestanas"></nav>
<input type="file" id="archivo" hidden>

<script src="js/data.js"></script>
<script src="js/data2.js"></script>
<script src="js/data3.js"></script>
<script src="js/data4.js"></script>
<script src="js/icons.js"></script>
<script src="js/app5.js"></script>
</body>
</html>
